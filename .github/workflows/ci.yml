name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/**

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt -r requirements-dev.txt -i https://pypi.tuna.tsinghua.edu.cn/simple

      - name: Ruff format
        run: ruff format .

      - name: Ruff lint
        run: ruff check --fix .

      - name: Run tests with coverage
        run: pytest --cov=src --cov-fail-under=70 -v

      - name: Docker build
        run: docker build -t banksys_wjk:latest .
