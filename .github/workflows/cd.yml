name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "app.py,requirements.txt,Dockerfile,src,data,models,pages"
          target: "/opt/banksys_wjk"
          rm: false

      - name: Build and deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e

            APP="banksys_wjk"
            PORT_MIN=9333
            PORT_MAX=9340
            DEPLOY_DIR="/opt/${APP}"

            cd "${DEPLOY_DIR}"

            docker build --build-arg PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple -t ${APP}:latest .

            port_in_use() {
              ss -ltnH 2>/dev/null | grep -q ":$1 " && return 0
              docker ps --format "{{.Ports}}" 2>/dev/null | grep -q ":$1->" && return 0
              return 1
            }

            PORT=""
            for p in $(seq ${PORT_MIN} ${PORT_MAX}); do
              if ! port_in_use "$p"; then PORT="$p"; break; fi
            done
            [ -z "$PORT" ] && { echo "预留端口区间已全部占用,部署中止"; exit 1; }
            echo ">> 部署到主机端口 ${PORT}"

            docker rm -f ${APP} 2>/dev/null || true
            docker run -d --name ${APP} --restart unless-stopped -p ${PORT}:8501 ${APP}:latest
            sleep 3
            curl -fsS "http://localhost:${PORT}/_stcore/health"
            echo ">> 部署成功: http://${SSH_HOST}:${PORT}"
